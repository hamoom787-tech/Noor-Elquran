services:
  - type: web
    name: quran-reels-generator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AUTO_OPEN_BROWSER
        value: "0"
      - key: HOST
        value: "0.0.0.0"
      - key: WHISPER_ENABLED
        value: "0"
      - key: SEO_ENABLED
        value: "1"
